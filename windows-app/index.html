<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202127" />
    <title>Wicx</title>
  </head>
  <body>
    <main class="panel" aria-label="Wicx panel">
      <header class="heading">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
          <div class="brand-copy">
            <div class="brand-title"><h1>Wicx</h1><span id="version" class="version-badge" hidden></span></div>
            <p>Push-to-talk transcription</p>
          </div>
        </div>
        <nav class="header-actions" aria-label="Panel controls">
          <button id="pin" class="header-action" type="button" aria-label="Unpin panel from top" aria-pressed="true" title="Unpin overlay"></button>
          <button id="settings" class="header-action" type="button" aria-label="Provider key settings" title="Settings"></button>
          <button id="close" class="header-action close" type="button" aria-label="Hide Wicx panel" title="Hide panel"></button>
        </nav>
      </header>

      <section class="status-banner" id="status-banner" data-state="connecting">
        <p class="state" id="connection"><span class="state-dot"></span>Connecting to Wicx…</p>
        <span id="status-kind" class="status-kind" hidden>Auth error</span>
        <p class="error" id="error" role="alert" hidden></p>
        <div class="status-actions" id="status-actions" hidden>
          <button id="error-keys" type="button">Enter API Key</button>
          <button id="error-provider" type="button">Switch Provider</button>
        </div>
      </section>
      <button id="reconnect" class="reconnect" type="button" hidden>Retry now</button>
      <p class="focus-result" id="focus-result" hidden></p>

      <section class="actions" aria-label="Recording controls">
        <button id="toggle" class="action primary" disabled>Start recording</button>
        <button id="cancel" class="action" disabled>Cancel</button>
      </section>

      <div class="audio-monitor" aria-live="off">
        <span class="audio-source"><span class="audio-dot"></span>Mic ready: <strong id="audio-mic">Default</strong></span>
        <div id="audio-meter" class="audio-meter" role="meter" aria-label="Microphone input level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Not recording" data-active="false">
          <span class="meter-bar"></span><span class="meter-bar"></span><span class="meter-bar"></span><span class="meter-bar"></span><span class="meter-bar"></span>
        </div>
        <span class="audio-status" id="audio-status">Waiting for daemon</span>
      </div>

      <section class="configuration" aria-label="Engine and hardware settings">
        <div class="section-heading"><span>Engine &amp; hardware</span><small>Click to change</small></div>
        <div class="tiles">
        <button class="tile" data-setting="provider" aria-expanded="false">
          <span class="tile-icon" data-icon="provider" aria-hidden="true"></span>
          <span class="tile-copy"><strong>Provider</strong><small id="provider-value">Local</small></span>
          <span class="chevron" aria-hidden="true">›</span>
        </button>
        <button class="tile" data-setting="model" aria-expanded="false">
          <span class="tile-icon" data-icon="model" aria-hidden="true"></span>
          <span class="tile-copy"><strong>Model</strong><small id="model-value">base</small></span>
          <span class="chevron" aria-hidden="true">›</span>
        </button>
        <button class="tile" data-setting="mic" aria-expanded="false">
          <span class="tile-icon" data-icon="mic" aria-hidden="true"></span>
          <span class="tile-copy"><strong>Microphone</strong><small id="mic-value">Default</small></span>
          <span class="chevron" aria-hidden="true">›</span>
        </button>
        </div>
      </section>

      <section id="chooser" class="chooser" aria-live="polite" hidden>
        <header><span id="chooser-icon" data-icon="provider" aria-hidden="true"></span><h2 id="chooser-title">Choose an option</h2></header>
        <div id="chooser-options" class="chooser-options" role="radiogroup" aria-labelledby="chooser-title"></div>
        <button id="manage-keys" class="manage-keys" hidden>Settings &amp; API keys</button>
      </section>

      <section class="live-section" aria-label="Live transcription settings">
        <label class="live-toggle" for="streaming-toggle">
          <span class="live-copy"><strong>Live transcription</strong><small>Stream voice tokens as you speak</small></span>
          <input id="streaming-toggle" type="checkbox" disabled />
          <span class="switch-track" aria-hidden="true"></span>
        </label>
        <p id="live-note" class="live-note" hidden></p>
        <p id="live-transcript" class="live-transcript" aria-live="polite" hidden></p>
      </section>

      <section class="footer-actions" aria-label="Last transcript">
        <div class="session-actions">
          <button id="copy" class="action" disabled>Copy transcript</button>
          <button id="retry" class="action" disabled>Re-transcribe last</button>
        </div>
        <p id="transcript" class="transcript" hidden></p>
        <div class="shortcut-hint" id="shortcut-hint" hidden>
          <span>Shortcut:</span><kbd>Ctrl</kbd><span>+</span><kbd>Space</kbd><span class="shortcut-separator">•</span><span>Press to toggle recording</span>
        </div>
        <p id="shortcut-note" class="shortcut-note" hidden></p>
      </section>
      <p id="hint" class="hint" hidden>Focus-test: opening this panel must leave the app behind it active.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
