name: Diarization service tests

on:
  push:
    branches: [main, New-features]
    paths:
      - "whisper_service/**"
      - "tests/test_diarization_jobs.py"
      - "tests/test_service_entitlements.py"
      - "tests/test_service_websocket.py"
      - "pyproject.toml"
      - ".github/workflows/diarization-service-tests.yml"
  pull_request:
    paths:
      - "whisper_service/**"
      - "tests/test_diarization_jobs.py"
      - "tests/test_service_entitlements.py"
      - "tests/test_service_websocket.py"
      - "pyproject.toml"
      - ".github/workflows/diarization-service-tests.yml"
  workflow_dispatch:

jobs:
  diarization-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Test authenticated diarization job API
        run: python -m pytest -q tests/test_diarization_jobs.py tests/test_paystack_webhook_route.py tests/test_paystack_webhooks.py tests/test_service_billing.py tests/test_service_entitlements.py tests/test_service_websocket.py
