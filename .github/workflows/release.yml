name: Build desktop release

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9][0-9][0-9]"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Six-digit release date in DDMMYY format
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate date tag and package version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 scripts/validate_release.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build install and extension packages
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: bash scripts/package.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_DISPLAY: ${{ steps.release.outputs.display }}
        run: >-
          gh release create "$RELEASE_TAG"
          "dist/whisper-$RELEASE_TAG-linux-gnome.tar.gz"
          "dist/transcriber-gnome-extension-$RELEASE_TAG.zip"
          dist/whisper-linux-gnome.tar.gz
          dist/transcriber-gnome-extension.zip
          --title "Whisper $RELEASE_DISPLAY"
          --generate-notes
