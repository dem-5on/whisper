[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-transcriber"
version = "0.1.0"
description = "Linux-first, application-agnostic push-to-talk transcription daemon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
local = ["faster-whisper>=1.0", "numpy>=1.24"]
realtime = ["websockets>=14", "numpy>=1.24"]
dev = ["pytest>=8.0"]

[project.scripts]
transcriber = "transcriber.cli:main"
transcriber-daemon = "transcriber.daemon:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["transcriber*"]
