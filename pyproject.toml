[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-transcriber"
version = "2026.10.8"
description = "Whisper: a Linux-first push-to-talk transcription daemon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
local = ["faster-whisper>=1.0", "numpy>=1.24"]
realtime = ["websockets>=14", "numpy>=1.24"]
windows = ["sounddevice>=0.4.6"]
server = ["faster-whisper>=1.0", "ctranslate2>=4.0", "numpy>=1.24", "websockets>=14"]
dev = ["pytest>=8.0", "websockets>=14"]

[project.scripts]
whisper = "transcriber.cli:main"
whisper-daemon = "transcriber.daemon:main"
# Compatibility aliases for existing shortcuts and service installations.
transcriber = "transcriber.cli:main"
transcriber-daemon = "transcriber.daemon:main"
whisper-server = "whisper_service.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["transcriber*", "whisper_service*"]
